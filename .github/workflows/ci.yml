name: checks
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run --no-sync python scripts/check_skill.py
      - run: uv run --no-sync python scripts/package_skill.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: repograph-skill
          path: dist/skills/*
          if-no-files-found: error
      - run: uv build
      - run: uv run --no-sync python scripts/release_check.py
      - run: uv run --no-sync python scripts/smoke_wheel.py
  npm-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: uv sync --locked --group dev --python 3.12
      - run: uv build --wheel
      - run: uv run --no-sync python scripts/package_npm.py
      - uses: actions/upload-artifact@v4
        with:
          name: repograph-kit-npm
          path: dist/npm/*
          if-no-files-found: error
  canvas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: uv sync --locked --group dev --python 3.12
      - run: npm ci --prefix web/canvas --ignore-scripts --no-audit --no-fund
      - run: npm run check --prefix web/canvas
      - run: npm run format:check --prefix web/canvas
      - run: uv run --no-sync python scripts/canvas_fixtures.py
      - run: node web/canvas/node_modules/playwright/cli.js install --with-deps chromium
      - run: npm test --prefix web/canvas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvas-${{ matrix.os }}
          path: .repograph/canvas-qa/
          if-no-files-found: error
  npm-kit:
    needs: npm-package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: uv sync --locked --group dev --python 3.12
      - run: npm ci --prefix npm/repograph-kit --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix npm/repograph-kit
      - run: uv run --no-sync pytest tests/test_node_verification.py -q
      - uses: actions/download-artifact@v4
        with:
          name: repograph-kit-npm
          path: dist/npm
      - run: uv run --no-sync python scripts/smoke_npm.py
  javascript-verification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        vitest: ['4.1.10', '5.1.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: uv sync --locked --group dev --python 3.12
      - run: npm install --prefix "${{ runner.temp }}/repograph-js-runners" --ignore-scripts --no-audit --no-fund --save-exact jest@30.5.2 vitest@${{ matrix.vitest }}
      - run: uv run pytest tests/test_javascript_verification.py -q
        env:
          REPOGRAPH_JS_RUNNERS: ${{ runner.temp }}/repograph-js-runners
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --python 3.12
      - run: uv run --no-sync python scripts/benchmark.py --profile all --repeat 1 --max-seconds 300 --output benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ matrix.os }}
          path: benchmark.json
          if-no-files-found: error
  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --python 3.12
      - run: uv build
      - run: docker build -f scripts/security/Dockerfile -t repograph-security:dev .
      - run: uv run --no-sync python scripts/security_check.py --approve
