name: checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv build
      - run: uv run --no-sync python scripts/smoke_wheel.py
  javascript-verification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: uv sync --locked --group dev --python 3.12
      - run: npm install --prefix "${{ runner.temp }}/repograph-js-runners" --ignore-scripts --no-audit --no-fund --save-exact jest@30.5.2 vitest@5.1.0
      - run: uv run pytest tests/test_javascript_verification.py -q
        env:
          REPOGRAPH_JS_RUNNERS: ${{ runner.temp }}/repograph-js-runners
