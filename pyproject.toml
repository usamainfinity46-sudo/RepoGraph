[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repograph-mcp"
version = "0.1.0rc1"
description = "Local, model-agnostic repository intelligence over MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["mcp", "static-analysis", "dependency-graph", "impact-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "mcp>=1.28,<2",
  "pydantic>=2.10,<3",
  "pathspec>=0.12,<1",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-python>=0.25,<0.26",
  "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-typescript>=0.23,<0.24",
]

[project.scripts]
repograph = "repograph.cli:main"

[project.urls]
Repository = "https://github.com/usamainfinity46-sudo/RepoGraph"
Issues = "https://github.com/usamainfinity46-sudo/RepoGraph/issues"
Documentation = "https://github.com/usamainfinity46-sudo/RepoGraph/tree/main/docs"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "build>=1,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/repograph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
